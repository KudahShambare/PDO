name: Build, Test, and Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 1. Start a temporary MySQL database 
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # Security checks
      - name: Check Composer dependencies for vulnerabilities
        run: composer audit --format=table --no-interaction

      - name: Run Semgrep SAST scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/owasp-top-ten

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'https://your-test-url.com' 
          fail_action: true

      # 2. Point the testing environment to the temporary MySQL container
      - name: Create .env file for testing
        run: |
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_NAME=test_db" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASS=root" >> .env

      # 3. Run your schema script to build the tables and seed data
      - name: Setup Test Database
        run: php api/config.php 

      # Unit tests
      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit tests/CustomerTest.php